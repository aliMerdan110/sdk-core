name: mebabl_database
description: A Flutter SDK for Mebabl project-scoped database services, including collections, documents, queries, cursor pagination, and atomic batch writes.
version: 1.0.6
repository: https://github.com/aliMerdan110/Mebabl.Sdk
homepage: https://mebabl.com
issue_tracker: https://github.com/aliMerdan110/Mebabl.Sdk/issues

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  mebabl_core: ^1.2.0
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

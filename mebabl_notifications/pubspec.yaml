name: mebabl_notifications
description: Flutter SDK for Mebabl in-app notifications, device registration, user preferences, and Firebase Cloud Messaging.
version: 1.1.0
repository: https://github.com/aliMerdan110/Mebabl.Sdk
homepage: https://mebabl.com
issue_tracker: https://github.com/aliMerdan110/Mebabl.Sdk/issues
topics:
  - notifications
  - push-notifications
  - firebase
  - flutter
  - sdk

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  mebabl_core: ^1.2.0
  dio: ^5.11.1
  firebase_messaging: ^16.7.1
  flutter_secure_storage: ^9.2.2
  signalr_netcore: ^1.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
